# git-cliff configuration for AlTab source milestones.
# https://git-cliff.org/docs/configuration
#
# Only altab-v* tags count as product milestones (upstream v* tags are ignored).
# Unreleased notes accumulate on merge; the maintainer cuts a version deliberately.

[remote.github]
owner = "salasebas"
repo = "altab"

[changelog]
header = ""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="altab-v") }}](https://github.com/salasebas/altab/compare/{{ previous.version }}...{{ version }}) ({{ timestamp | date(format="%Y-%m-%d") }})
{% else -%}
## Unreleased
{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
* {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/salasebas/altab/commit/{{ commit.id }}))\
{%- if commit.remote.username %} by @{{ commit.remote.username }}{%- endif -%}
{%- if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}](https://github.com/salasebas/altab/pull/{{ commit.remote.pr_number }}){%- endif %}
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
require_conventional = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "altab-v[0-9].*"
ignore_tags = ""
topo_order = false
sort_commits = "newest"
recurse_submodules = false
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/salasebas/altab/issues/${2}))" },
]
commit_parsers = [
  { message = "^[Mm]erge ", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^docs", group = "Documentation" },
  { message = "^style", group = "Styles" },
  { message = "^refactor", group = "Refactor" },
  { message = "^test", group = "Testing" },
  { message = "^ci", group = "CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(changelog\\)", skip = true },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^build", group = "Build" },
  { body = ".*security", group = "Security" },
  { message = ".*", skip = true },
]
