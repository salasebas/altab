# Changelog + intentional source milestones (altab-v*).
#
# On push to main: update only ## Unreleased via git-cliff (no tag, no Release, no SemVer bump).
# On workflow_dispatch: maintainer cuts altab-vX.Y.Z (promote Unreleased, tag, source-only GitHub Release).
#
# No AppCenter, Sparkle, appcast, notarization, or binary packaging.
# Tooling: git-cliff (https://git-cliff.org) — maintained upstream CLI, not a custom release bot.
name: Release notes

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer to cut (MAJOR.MINOR.PATCH). Required to create a source milestone."
        required: true
        type: string
      dry_run:
        description: "If true, compute changelog changes but do not commit, tag, or publish."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-notes-main
  cancel-in-progress: false

env:
  # Pin the published binary; bump deliberately when upgrading git-cliff.
  GIT_CLIFF_VERSION: "2.13.1"

jobs:
  unreleased:
    name: Update Unreleased
    if: github.event_name == 'push' && !contains(github.event.head_commit.message || '', '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Install git-cliff
        run: |
          set -euo pipefail
          curl -sL "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin \
              "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"
          git-cliff --version

      - name: Update Unreleased section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          chmod +x scripts/changelog_milestone.sh
          scripts/changelog_milestone.sh update

      - name: Commit Unreleased changelog if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- changelog.md; then
            echo "Unreleased section already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog.md
          git commit -m "chore(changelog): update Unreleased [skip ci]"
          git push

  cut:
    name: Cut source milestone
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be MAJOR.MINOR.PATCH (got: $VERSION)" >&2
            exit 1
          fi
          tag="altab-v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "tag already exists: ${tag}" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release already exists: ${tag}" >&2
            exit 1
          fi

      - name: Install git-cliff
        run: |
          set -euo pipefail
          curl -sL "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin \
              "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"
          git-cliff --version

      - name: Set up Node.js (package.json version bump only)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.20.0
          package-manager-cache: false

      - name: Promote Unreleased and prepare release notes
        id: promote
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          chmod +x scripts/changelog_milestone.sh
          scripts/changelog_milestone.sh promote "$VERSION"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          scripts/changelog_milestone.sh notes "$VERSION" >"$notes_file"
          echo "notes_file=$notes_file" >>"$GITHUB_OUTPUT"
          echo "tag=altab-v${VERSION}" >>"$GITHUB_OUTPUT"

      - name: Show diff (always)
        run: git --no-pager diff -- changelog.md package.json || true

      - name: Commit, tag, and publish source-only Release
        if: ${{ inputs.dry_run != true && inputs.dry_run != 'true' }}
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ steps.promote.outputs.tag }}
          NOTES_FILE: ${{ steps.promote.outputs.notes_file }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog.md package.json
          git commit -m "chore(release): ${VERSION} [skip ci]"
          git tag -a "$TAG" -m "AlTab source milestone ${VERSION}"
          git push origin HEAD
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "AlTab ${VERSION}" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Dry-run summary
        if: ${{ inputs.dry_run == true || inputs.dry_run == 'true' }}
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ steps.promote.outputs.tag }}
        run: |
          echo "Dry run: would commit, tag ${TAG}, and create a source-only GitHub Release for ${VERSION}."
          echo "No git push or gh release create was performed."
